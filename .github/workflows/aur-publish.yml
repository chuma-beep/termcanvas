name: Publish AUR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release version (without v prefix, e.g. 0.39.9)"
        required: true

permissions:
  contents: read

env:
  AUR_TERMCANVAS_BIN: ssh://aur@aur.archlinux.org/termcanvas-bin.git
  AUR_TERMCANVAS: ssh://aur@aur.archlinux.org/termcanvas.git
  GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/aur

jobs:
  aur-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/aur << 'EOF'
          ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/aur
 
      - name: Compute checksums
        id: checksums
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          APPIMAGE_URL="https://github.com/blueberrycongee/termcanvas/releases/download/v${VERSION}/TermCanvas-${VERSION}.AppImage"
          APPIMAGE_SHA=$(curl -sL "$APPIMAGE_URL" | sha256sum | cut -d' ' -f1)
          echo "appimage_sha256=${APPIMAGE_SHA}" >> "$GITHUB_OUTPUT"

          SOURCE_URL="https://github.com/blueberrycongee/termcanvas/archive/v${VERSION}.tar.gz"
          SOURCE_SHA=$(curl -sL "$SOURCE_URL" | sha256sum | cut -d' ' -f1)
          echo "source_sha256=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish termcanvas-bin
        run: |
          git clone "$AUR_TERMCANVAS_BIN" aur-bin || {
            echo "First-time setup required for termcanvas-bin."
            echo "Create the package at https://aur.archlinux.org/packages/termcanvas-bin first, then re-run this workflow."
            exit 1
          }
          VERSION="${{ steps.checksums.outputs.version }}"
          SHA256="${{ steps.checksums.outputs.appimage_sha256 }}"

          # Update PKGBUILD and .SRCINFO
          sed -e "s/pkgver=.*/pkgver=${VERSION}/" \
              -e "s/sha256sums=('SKIP'/sha256sums=('${SHA256}'/" \
              contrib/arch/bin/PKGBUILD > aur-bin/PKGBUILD

          sed -e "s/pkgver = .*/pkgver = ${VERSION}/" \
              -e "0,/sha256sums = SKIP/{s/sha256sums = SKIP/sha256sums = ${SHA256}/}" \
              contrib/arch/bin/.SRCINFO > aur-bin/.SRCINFO

          cd aur-bin
          git config user.name "wisdom"
          git config user.email "wisboynelson123@gmail.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to v${VERSION}"
          git push

      - name: Publish termcanvas (source)
        run: |
          git clone "$AUR_TERMCANVAS" aur-src || {
            echo "First-time setup required for termcanvas."
            echo "Create the package at https://aur.archlinux.org/packages/termcanvas first, then re-run this workflow."
            exit 1
          }
          VERSION="${{ steps.checksums.outputs.version }}"
          SHA256="${{ steps.checksums.outputs.source_sha256 }}"

          # Update PKGBUILD and .SRCINFO
          sed -e "s/pkgver=.*/pkgver=${VERSION}/" \
              -e "s/sha256sums=('SKIP'/sha256sums=('${SHA256}'/" \
              contrib/arch/source/PKGBUILD > aur-src/PKGBUILD

          sed -e "s/pkgver = .*/pkgver = ${VERSION}/" \
              -e "0,/sha256sums = SKIP/{s/sha256sums = SKIP/sha256sums = ${SHA256}/}" \
              contrib/arch/source/.SRCINFO > aur-src/.SRCINFO

          cd aur-src
          git config user.name "wisdom"
          git config user.email "wisboynelson123@gmail.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to v${VERSION}"
          git push
