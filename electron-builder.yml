appId: com.blueberrycongee.termcanvas
productName: TermCanvas
copyright: Copyright © 2026 blueberrycongee

publish:
  provider: github
  owner: blueberrycongee
  repo: termcanvas

directories:
  output: out
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  - from: dist-cli
    to: cli
    filter:
      - "**/*"
  - from: skills
    to: skills
    filter:
      - "**/*"
  - from: dist-computer-use
    to: .
    filter:
      - "**/*"

asarUnpack:
  - node_modules/node-pty/**/*

mac:
  identity: "-"
  signIgnore:
    - ".*\\/computer-use-helper$"
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  category: Development
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - pacman
    - flatpak

flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: "24.08"
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: "24.08"
  branch: stable
  finishArgs:
    - --socket=wayland
    - --socket=x11
    - --share=ipc
    - --device=dri
    - --socket=pulseaudio
    - --filesystem=home
    - --share=network
    - --talk-name=org.freedesktop.Notifications

win:
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
