id: io.github.blueberrycongee.termcanvas
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

command: termcanvas
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
  - --share=network
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: termcanvas
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
        - --socket=x11
      env:
        XDG_CACHE_HOME: /run/build/termcanvas/flatpak-node/cache
        npm_config_cache: /run/build/termcanvas/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node22
    build-commands:
      - flatpak-node-generator pnpm pnpm-lock.yaml
      - chmod +x flatpak-node/patch.sh && flatpak-node/patch.sh || true
      - pnpm install --frozen-lockfile --offline
      - pnpm build
      - pnpm exec electron-builder --linux dir --publish never
      - |
        install -dm755 "${FLATPAK_DEST}/termcanvas"
        cp -r dist/* "${FLATPAK_DEST}/termcanvas/"
        cp -r dist-electron/* "${FLATPAK_DEST}/termcanvas/"
        install -Dm644 build/icon.png "${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.blueberrycongee.termcanvas.png"
    sources:
      - type: git
        url: https://github.com/blueberrycongee/termcanvas.git
        tag: v0.39.8
        commit: HEAD
      - type: file
        path: pnpm-lock.yaml
        dest-filename: pnpm-lock.yaml
